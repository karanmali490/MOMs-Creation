<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
}
.cart-card{
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div class="container mt-5">
    <h2 class="mb-4">Shopping Cart</h2>

    <div class="cart-card">

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Canvas Tote Bag</td>
                    <td>₹299</td>
                    <td>
                        <input type="number" value="1" class="form-control qty">
                    </td>
                    <td>₹299</td>
                </tr>
            </tbody>
        </table>

        <h4 class="text-end">
            Grand Total : ₹299
        </h4>

        <div class="text-end">
            <a href="checkout.html" class="btn btn-success">
                Proceed To Checkout
            </a>
        </div>

    </div>
</div>

</body>
</html>
